[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
pollster = "0.4"
png = "0.18"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cada sistema usa o seu: Metal no macOS, DirectX 12 no Windows, Vulkan no Linux (OpenGL de reserva).
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "dx12", "vulkan", "gles", "wgsl"] }
winit = "=0.30.13"

[profile.dev]
debug = 0
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"
