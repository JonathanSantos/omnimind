# Gera os pacotes de macOS, Windows e Linux. Uma tag v* publica tudo numa release;
# rodar à mão (workflow_dispatch) só deixa os pacotes como artefatos do run.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          # Ubuntu 22.04: glibc mais antiga, o binário roda em mais distribuições.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle.sh
          ditto -c -k --keepParent dist/Omnimind.app Omnimind-${{ matrix.name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/package.sh Omnimind-${{ matrix.name }}
          tar -C dist -czf Omnimind-${{ matrix.name }}.tar.gz Omnimind-${{ matrix.name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./scripts/package.sh Omnimind-${{ matrix.name }} .exe
          cd dist && 7z a -tzip ../Omnimind-${{ matrix.name }}.zip Omnimind-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: Omnimind-${{ matrix.name }}
          path: |
            Omnimind-${{ matrix.name }}.zip
            Omnimind-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum Omnimind-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
