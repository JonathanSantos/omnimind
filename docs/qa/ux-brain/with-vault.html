<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métricas · Omnimind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=Sometype+Mono&display=swap" rel="stylesheet">
<style>
:root{--fundo:#141416;--barra:#19191C;--painel:#1D1D20;--texto:#EDEDEE;--sec:#B0B0B7;--apagado:#94949C;--linha:#2D2D32;--hover:#232327;--sel:#2A2A2F;--acento:#4CC29A;
--t1:#C9452E;--t2:#B5801A;--t3:#1F7A5C;--t4:#1E7F96;--t5:#2B5FD9;
--sans:"Familjen Grotesk",system-ui,sans-serif;--mono:"Sometype Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow-x:hidden;background:var(--fundo);color:var(--texto);font:400 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
/* barra lateral */
aside{background:var(--barra);border-right:1px solid var(--linha);display:flex;flex-direction:column;padding:20px 12px 16px}
.marca{display:flex;align-items:center;gap:10px;padding:0 10px;height:28px;font-weight:600;font-size:15px;margin-bottom:20px}
.busca{display:flex;justify-content:space-between;align-items:center;width:100%;height:32px;padding:0 10px;border:1px solid var(--linha);border-radius:8px;color:var(--apagado);margin-bottom:20px}
.busca:hover{background:var(--hover)}
.busca kbd{font:11px var(--mono)}
nav{display:grid;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 10px;border-radius:6px;color:var(--sec)}
nav a:hover{background:var(--hover);color:var(--texto)}
nav a[aria-current]{background:var(--sel);color:var(--texto);font-weight:600}
nav span{font:12px var(--mono);color:var(--apagado)}
.rodape{margin-top:auto;display:grid;gap:4px}
.conexao{display:flex;align-items:center;gap:8px;padding:0 10px;height:28px;font-size:12px;color:var(--sec)}
.conexao i{width:6px;height:6px;border-radius:50%;background:var(--acento)}
/* conteúdo */
main{overflow-y:auto;padding:0 44px 32px 24px;min-width:0}
header{display:flex;align-items:center;gap:16px;height:56px}
h1{font-size:18px;font-weight:600}
.per{display:flex;gap:2px}
.per button{height:28px;padding:0 10px;border-radius:6px;color:var(--sec);font-size:13px}
.per button:hover{background:var(--hover);color:var(--texto)}
.per button[aria-pressed=true]{background:var(--sel);color:var(--texto);font-weight:600}
h2{font-size:16px;font-weight:600}
.numeros{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:8px}
.num{border-top:1px solid var(--linha);padding-top:12px}
.num dt{font-size:13px;color:var(--sec)}
.num dd{font-size:34px;line-height:1.15;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num small{display:block;font-size:13px;color:var(--apagado);margin-top:2px}
.meio{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:44px;margin-top:32px}
.cab{display:flex;justify-content:space-between;align-items:baseline;height:24px}
.leg{display:flex;gap:16px;font-size:12px;color:var(--sec);align-items:center}
.leg .dia{font:12px var(--mono);color:var(--apagado);min-width:76px;text-align:right}
.leg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.leg em{font:normal 12px var(--mono);color:var(--texto);margin-left:4px}
.ia{background:var(--acento)}.vc{background:var(--apagado)}
.plot{position:relative;display:flex;height:216px;margin:16px 0 0 32px;border-radius:2px}
.plot:focus-visible{outline-offset:6px}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--linha);opacity:.7;pointer-events:none}
.gl span{position:absolute;left:-32px;top:-7px;font:11px var(--mono);color:var(--apagado)}
.col{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%}
.st{display:flex;flex-direction:column;gap:1px;border-radius:3px 3px 0 0;overflow:hidden;transform-origin:bottom;animation:sobe .4s cubic-bezier(.2,.7,.2,1) both}
.st i{display:block;min-height:0}
.plot[data-ativo] .col:not(.on){opacity:.5}
@keyframes sobe{from{transform:scaleY(.04)}}
.eixo{display:flex;margin:8px 0 0 32px;font:11px var(--mono);color:var(--apagado)}
.eixo span{flex:1;text-align:center}
.eixo.tres{justify-content:space-between}.eixo.tres span{flex:none}
/* sem precisar repetir */
.sem{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:20px 20px 12px;align-self:start}
.sem .topo{display:flex;align-items:baseline;gap:12px;margin-top:12px}
.sem .topo strong{font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.sem .topo span{font-size:13px;color:var(--sec)}
.sem p{font-size:13px;color:var(--sec);margin-top:8px;max-width:34ch}
.livro{list-style:none;padding:0;margin-top:16px}
.livro li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--linha)}
.livro q{quotes:"“" "”";font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.livro .n{font:12px var(--mono);color:var(--sec)}
.barra{grid-column:1/-1;height:4px;border-radius:2px;background:var(--acento);transform-origin:left;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.sem .rod{font-size:12px;color:var(--apagado);border-top:1px solid var(--linha);padding:10px 0 2px}
/* listas */
.listas{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:44px;margin-top:32px}
.lista{list-style:none;padding:0;margin-top:8px}
.lista a{display:grid;grid-template-columns:24px minmax(0,1fr) 44px;column-gap:4px;align-items:center;padding:9px 8px;margin:0 -8px;border-top:1px solid var(--linha);border-radius:6px}
.lista a:hover{background:var(--hover)}
.lista li:first-child a{border-top-color:transparent}
.lista .i{font:12px var(--mono);color:var(--apagado)}
.lista .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista .c{font:13px var(--mono);text-align:right}
.lista .b{grid-column:2;height:4px;border-radius:2px;margin-top:6px;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.lista .p{font:11px var(--mono);color:var(--apagado)}
.temas a{grid-template-columns:minmax(0,1fr) 44px 40px}
.temas .b{grid-column:1}
.temas .p{text-align:right}
@media (prefers-reduced-motion:reduce){.st{animation:none}.barra,.lista .b{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="marca"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EDEDEE" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4v16M9 4l11 16M20 4 9 20"/></svg>Omnimind</div>
  <button class="busca" type="button"><span>Buscar</span><kbd>⌘K</kbd></button>
  <nav aria-label="Principal">
    <a href="#">Notas<span>47</span></a><a href="#">Memórias<span>94</span></a><a href="#">Grafo</a><a href="#">Atividade</a>
    <a href="#" aria-current="page">Métricas</a><a href="#">Perfil</a>
  </nav>
  <div class="rodape"><div class="conexao"><i></i>Claude Code conectado</div><nav><a href="#">Ajustes</a></nav></div>
</aside>
<main>
  <header>
    <h1>Métricas</h1>
    <div class="per" role="group" aria-label="Período"></div>
  </header>
  <dl class="numeros" aria-live="polite"></dl>
  <section class="meio">
    <div>
      <div class="cab"><h2>Leituras por dia</h2>
        <div class="leg"><span class="dia" id="dia" aria-live="polite"></span><span><b class="ia"></b>IA<em id="vIa"></em></span><span><b class="vc"></b>Você<em id="vVc"></em></span></div></div>
      <div class="plot" id="plot" tabindex="0" role="group" aria-label="Leituras por dia. Use as setas para percorrer os dias."></div>
      <div class="eixo" id="eixo"></div>
    </div>
    <section class="sem" aria-labelledby="sem-t">
      <h2 id="sem-t">Sem precisar repetir</h2>
      <div class="topo"><strong id="sTotal"></strong><span id="sPer"></span></div>
      <p>Instruções que a IA já sabia pelas suas memórias e que você não precisou dar de novo.</p>
      <ul class="livro" id="livro"></ul>
      <div class="rod" id="sRod"></div>
    </section>
  </section>
  <section class="listas">
    <div><h2>Mais lidas</h2><ol class="lista" id="lidas"></ol></div>
    <div><h2>Temas mais lidos</h2><ol class="lista temas" id="temas"></ol></div>
  </section>
</main>
</div>
<script>
const $=s=>document.querySelector(s),br=n=>n.toLocaleString('pt-BR'),WD=['dom','seg','ter','qua','qui','sex','sáb'];
// Distribui um total inteiro em n dias, respeitando pesos (fins de semana mais leves).
function split(total,w){const s=w.reduce((a,b)=>a+b),r=w.map(x=>total*x/s),o=r.map(Math.floor);
  let k=total-o.reduce((a,b)=>a+b);r.map((x,i)=>[x-o[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,k).forEach(([,i])=>o[i]++);return o}
function pesos(n,seed){let s=seed;return Array.from({length:n},(_,i)=>{s=s*16807%2147483647;
  return(new Date(2026,10,1-(n-1-i)).getDay()%6?1:.3)*(.7+.6*s/2147483647)})}
const serie=(n,ia,vc,s)=>({ia:split(ia,pesos(n,s)),vc:split(vc,pesos(n,s*7+3))});
const TEMA={'Rota Certa':'--t1','Arquitetura':'--t2','Preferências':'--t3','Estudos de Go':'--t4','Design':'--t5'};
const D={
 7:{leit:214,mem:18,cor:6,busca:87,rep:9,dias:7,per:'nesta semana',
  s:{ia:[28,41,33,37,29,9,14],vc:[4,6,3,5,2,0,3]},
  lidas:[31,24,19,12,7],temas:[92,54,31,22,15],
  livro:[['usar ureq, sem tokio',4],['migração antes da aplicação',3],['commit no formato tipo(escopo)',2]]},
 30:{leit:1042,mem:63,cor:21,busca:81,rep:37,dias:30,per:'nos últimos 30 dias',s:serie(30,927,115,11),
  lidas:[118,96,71,52,29],temas:[441,252,143,108,98],
  livro:[['usar ureq, sem tokio',14],['migração antes da aplicação',10],['commit no formato tipo(escopo)',8],['deploy só de terça a quinta',5]]},
 90:{leit:2871,mem:140,cor:74,busca:76,rep:96,dias:90,per:'nos últimos 90 dias',s:serie(90,2551,320,5),
  lidas:[302,251,188,134,77],temas:[1190,640,452,331,258],
  livro:[['usar ureq, sem tokio',38],['migração antes da aplicação',27],['commit no formato tipo(escopo)',19],['deploy só de terça a quinta',12]]}};
const NOMES=['Deploy em duas etapas','Fila síncrona no Cuscuz','Formato de commit','Janela de deploy da Rota Certa','Reunião com a Coopcarga'];
const TN=Object.keys(TEMA);
let per=7,cur=-1,dados;
const dec=(x,d=1)=>x.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:0});

$('.per').innerHTML=[7,30,90].map(p=>`<button type="button" data-p="${p}">${p} dias</button>`).join('');
$('.per').addEventListener('click',e=>{const b=e.target.closest('button');if(b)render(+b.dataset.p)});

function render(p){
  per=p;const d=D[p];cur=-1;
  document.querySelectorAll('.per button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===p));
  $('.numeros').innerHTML=[
   ['Leituras',br(d.leit),`${dec(d.leit/d.dias,0)} por dia`],
   ['Memórias novas',br(d.mem),`${dec(d.mem/d.dias)} por dia`],
   ['Correções suas',br(d.cor),`${dec(d.cor/d.dias)} por dia`],
   ['Buscas com resposta',d.busca+'%',`${100-d.busca}% ficaram sem resposta`]
  ].map(([l,v,s])=>`<div class="num"><dt>${l}</dt><dd>${v}</dd><small>${s}</small></div>`).join('');
  // gráfico
  const n=d.dias,tot=d.s.ia.map((v,i)=>v+d.s.vc[i]),pico=Math.max(...tot);
  const passo=[5,10,20,25,50,100].find(s=>s*4>=pico*1.05),max=passo*4;
  dados=tot.map((t,i)=>{const dt=new Date(2026,10,1-(n-1-i));return{ia:d.s.ia[i],vc:d.s.vc[i],t,wd:WD[dt.getDay()],dm:`${dt.getDate()}/${dt.getMonth()+1}`}});
  $('#plot').innerHTML=[0,1,2,3,4].map(k=>`<div class="gl" style="bottom:calc(${k*25}% - 1px)"><span>${k*passo}</span></div>`).join('')+
   dados.map((x,i)=>`<div class="col" data-i="${i}"><div class="st" style="height:${x.t/max*100}%;width:${n===7?'44px':'68%'}">${x.vc?`<i class="vc" style="flex:${x.vc}"></i>`:''}<i class="ia" style="flex:${x.ia}"></i></div></div>`).join('');
  $('#plot').removeAttribute('data-ativo');
  $('#eixo').className='eixo'+(n===7?'':' tres');
  $('#eixo').innerHTML=n===7?dados.map(x=>`<span>${x.wd} ${x.dm}</span>`).join(''):[0,n>>1,n-1].map(i=>`<span>${dados[i].dm}</span>`).join('');
  mostrar(-1);
  // sem precisar repetir
  $('#sTotal').textContent=br(d.rep);$('#sPer').textContent=`repetições evitadas ${d.per}`;
  const mx=d.livro[0][1];
  $('#livro').innerHTML=d.livro.map(([f,c])=>`<li><q>${f}</q><span class="n">${c}×</span><div class="barra" style="width:${c/mx*100}%"></div></li>`).join('');
  $('#sRod').textContent=`Uma repetição evitada a cada ${Math.round(d.leit/d.rep)} leituras.`;
  // listas
  const lm=Math.max(...d.lidas);
  $('#lidas').innerHTML=d.lidas.map((c,i)=>`<li><a href="#"><span class="i">${i+1}</span><span class="t">${NOMES[i]}</span><span class="c">${c}</span><div class="b ia" style="width:${c/lm*100}%"></div></a></li>`).join('');
  const tm=Math.max(...d.temas);
  $('#temas').innerHTML=d.temas.map((c,i)=>`<li><a href="#"><span class="t">${TN[i]}</span><span class="c">${br(c)}</span><span class="p">${Math.round(c/d.leit*100)}%</span><div class="b" style="width:${c/tm*100}%;background:var(${TEMA[TN[i]]})"></div></a></li>`).join('');
}
function mostrar(i){
  cur=i;const x=i<0?null:dados[i];
  $('#dia').textContent=x?`${x.wd} ${x.dm}`:'';
  $('#vIa').textContent=br(x?x.ia:dados.reduce((a,b)=>a+b.ia,0));
  $('#vVc').textContent=br(x?x.vc:dados.reduce((a,b)=>a+b.vc,0));
  const pl=$('#plot');x?pl.dataset.ativo='':pl.removeAttribute('data-ativo');
  pl.querySelectorAll('.col').forEach((c,k)=>c.classList.toggle('on',k===i));
}
const pl=$('#plot');
pl.addEventListener('pointerover',e=>{const c=e.target.closest('.col');if(c)mostrar(+c.dataset.i)});
pl.addEventListener('pointerleave',()=>{if(document.activeElement!==pl)mostrar(-1)});
pl.addEventListener('blur',()=>mostrar(-1));
pl.addEventListener('keydown',e=>{
  const n=dados.length,k={ArrowRight:1,ArrowLeft:-1}[e.key];
  if(k){e.preventDefault();mostrar(cur<0?(k>0?0:n-1):Math.min(n-1,Math.max(0,cur+k)))}
  else if(e.key==='Home'){e.preventDefault();mostrar(0)}
  else if(e.key==='End'){e.preventDefault();mostrar(n-1)}
  else if(e.key==='Escape')mostrar(-1);
});
render(7);
</script>
</body>
</html>
