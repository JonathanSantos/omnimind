<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grafo · Omnimind</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=Sometype+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#141416;--side:#19191C;--panel:#1D1D20;--tx:#EDEDEE;--tx2:#B0B0B7;--mut:#94949C;--line:#2D2D32;--hov:#232327;--sel:#2A2A2F;--ac:#4CC29A;--sans:'Familjen Grotesk',system-ui,sans-serif;--mono:'Sometype Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:400 14px/1.4 var(--sans)}
body{display:flex}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
#side{width:232px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;padding:0 8px;height:32px;margin-bottom:24px}
.search{display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 10px;margin-bottom:24px;border:1px solid var(--line);border-radius:8px;color:var(--mut);font-size:13px}
.search:hover{background:var(--hov);color:var(--tx2)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 10px;border-radius:6px;color:var(--tx2);text-decoration:none}
.nav a:hover{background:var(--hov);color:var(--tx)}
.nav a[aria-current]{background:var(--sel);color:var(--tx)}
.nav .mono{color:var(--mut)}
.bot{margin-top:auto;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.conn{display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:var(--tx2)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:56px;flex:none;display:flex;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:600}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px}
.seg button{height:28px;padding:0 12px;border-radius:6px;color:var(--tx2);font-size:13px}
.seg button:hover{background:var(--hov);color:var(--tx)}
.seg button[aria-checked=true]{background:var(--sel);color:var(--tx)}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv:focus-visible{outline-offset:-2px}
#tip{position:absolute;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:grid;gap:2px;font-size:13px;color:var(--tx2)}
#tip b{font-size:14px;font-weight:600;color:var(--tx)}
.legend{position:absolute;left:24px;bottom:14px;display:flex;gap:16px;font-size:12px;color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 24px;border-top:1px solid var(--line);color:var(--mut)}
#msg{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
#msg .mono{color:var(--mut);margin-right:8px}
#panel{width:380px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#panel[hidden]{display:none}
.ph{display:flex;gap:12px;align-items:flex-start;padding:20px 20px 16px}
.ph h2{flex:1;font-size:18px;font-weight:600;line-height:1.3}
.ph h2:focus{outline:0}
.ph button{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--tx2)}
.ph button:hover{background:var(--hov);color:var(--tx)}
.pb{flex:1;overflow:auto;padding:0 20px 24px}
.meta{display:grid;grid-template-columns:104px 1fr;gap:8px 12px;font-size:13px}
.meta dt{color:var(--mut)}
.meta dd{overflow-wrap:anywhere;display:flex;align-items:baseline;gap:6px}
.pb h3{font-size:16px;font-weight:600;margin:32px 0 8px}
.bars{display:flex;align-items:flex-end;gap:2px;height:36px}
.bars b{flex:1;border-radius:1px}
.ax{display:flex;justify-content:space-between;margin-top:6px;font:12px var(--mono);color:var(--mut)}
.pb ul{list-style:none;padding:0}
.pb li button{display:flex;align-items:center;gap:8px;width:calc(100% + 16px);margin:0 -8px;min-height:32px;padding:4px 8px;border-radius:6px;text-align:left;font-size:13px}
.pb li button:hover{background:var(--hov)}
.pb li span{flex:1;min-width:0}
.pb li em{font-style:normal;color:var(--mut);font-size:12px}
.pf{display:flex;gap:8px;padding:16px 20px;border-top:1px solid var(--line)}
.pf button{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.pf button:hover{background:var(--hov)}
.pf .pri{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
.pf .pri:hover{background:var(--ac);opacity:.9}
</style>
</head>
<body>

  <div class="brand"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#4CC29A" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 4c6 0 8 6 16 6M2 10h16M2 16c6 0 8-6 16-6"/></svg>Omnimind</div>

    <a href="#">Atividade</a><a href="#">Métricas</a><a href="#">Perfil</a>
  </nav>
  <div class="bot"><div class="conn"><i class="dot" style="background:var(--ac)"></i>Claude Code conectado</div><nav class="nav" aria-label="Ajustes"><a href="#">Ajustes</a></nav></div>
</aside>
<main>
  <header>
    <h1>Grafo</h1>
    <div class="seg" id="forma" role="radiogroup" aria-label="Forma do grafo"><button role="radio" data-v="f">Feixes</button><button role="radio" data-v="r">Raízes</button></div>

  </header>
  <section id="stage">
    <canvas id="cv" tabindex="0" role="application" aria-label="Grafo do cofre. Setas percorrem os itens, Enter abre o detalhe."></canvas>
    <div id="tip" role="tooltip"></div>
    <div class="legend"><span>● Nota</span><span>○ Memória</span><span>Tamanho pelas leituras em 30 dias</span></div>
    <div class="sr" id="sr" aria-live="polite"></div>
  </section>
  <footer><span id="cnt" class="mono"></span><span id="msg">Nenhuma leitura da IA nesta sessão</span></footer>
</main>
<aside id="panel" hidden aria-label="Detalhe do item">
  <div class="ph"><h2 id="pt" tabindex="-1"></h2><button id="px" aria-label="Fechar detalhe"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <div class="pb" id="pb"></div>
  <div class="pf" id="pf"></div>
</aside>

    ctx.fillStyle='#94949C';ctx.font='12px "Sometype Mono"';ctx.fillText(ct,x+16+w1+8,py);
  });
  ctx.globalAlpha=1;tipUpdate();
}
function tipUpdate(){
  const i=hov>=0?hov:kb;if(i<0){tp.style.opacity=0;tipI=-1;return}
  const it=items[i];
  if(tipI!==i){tipI=i;tp.innerHTML=`<b>${it.title}</b><span>${it.mem?"○ Memória":"● Nota"} · ${it.th.name}</span><span>${vezes(it.reads)}</span>`;$('#sr').textContent=`${it.mem?"Memória":"Nota"}, ${it.title}, ${it.th.name}, ${it.reads} leituras em 30 dias`}
  const w=tp.offsetWidth,h=tp.offsetHeight;let x=it.x+14,y=it.y-h/2;if(x+w>W-8)x=it.x-14-w;y=Math.max(8,Math.min(H-h-8,y));
  tp.style.transform=`translate(${x}px,${y}px)`;tp.style.opacity=1;
}
function arrive(p){
  p.to.reads++;p.to.days[29]++;tipI=-1;
  msg.innerHTML=`<span class="mono">${new Date().toLocaleTimeString('pt-BR')}</span>A IA leu “${p.to.title}”, ligada a “${p.from.title}”`;
  if(sel===p.to.id)open(p.to);
}
function step(dt0){
  const dt=RM?10:dt0;let d=false;
  if(started&&intro<1){intro=Math.min(1,intro+dt/1.9);d=true}
  if(m!==mode){m+=Math.sign(mode-m)*Math.min(Math.abs(mode-m),dt/.8);d=true}
  const a=act(),tf=a>=0?1:0;if(a>=0)lastA=items[a];
  if(fo!==tf){fo+=Math.sign(tf-fo)*Math.min(Math.abs(tf-fo),dt/.18);d=true}
  items.forEach(it=>{const tv=show(it)?1:0;if(it.vis!==tv){it.vis+=Math.sign(tv-it.vis)*Math.min(Math.abs(tv-it.vis),dt/.3);d=true}});
  if(pulse){const p=pulse;if(!p.arr)p.t=RM?1:Math.min(1,p.t+dt0/1.1);if(p.t>=1&&!p.arr){p.arr=true;arrive(p)}if(p.arr)p.age+=dt0;if(p.age>1.8)pulse=null;d=true}
  if(d)dirty=true;
}
function frame(ts){const dt0=Math.min(.05,(ts-last)/1000);last=ts;step(dt0);if(dirty){dirty=false;draw()}requestAnimationFrame(frame)}
function sim(){
  const ok=links.filter(l=>show(l.a)&&show(l.b));
  if(ok.length&&!pulse&&started){const l=ok[Math.floor(rnd()*ok.length)],sw=rnd()<.5;pulse={l,from:sw?l.b:l.a,to:sw?l.a:l.b,t:0,age:0,arr:false}}
  setTimeout(sim,3600+rnd()*2400);
}
function seg(el,cb){
  const bs=[...el.children];
  const pick=i=>{bs.forEach((b,j)=>{b.setAttribute('aria-checked',j==i);b.tabIndex=j==i?0:-1});cb(bs[i].dataset.v)};
  bs.forEach((b,i)=>{b.onclick=()=>pick(i);b.onkeydown=e=>{const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d){e.preventDefault();const j=(i+d+bs.length)%bs.length;pick(j);bs[j].focus()}}});
  return pick;
}
seg($('#forma'),v=>{mode=v==='r'?1:0;dirty=true})(0);
const counts=()=>{$('#cnt').textContent=`${items.filter(show).length} itens · ${links.filter(l=>show(l.a)&&show(l.b)).length} ligações`};
seg($('#filtro'),v=>{filt=v;counts();dirty=true})(0);
$('#cn').textContent=items.filter(i=>!i.mem).length;$('#cm').textContent=items.filter(i=>i.mem).length;
function open(it,focus){
  sel=it.id;panel.hidden=false;$('#pt').textContent=it.title;const mx=Math.max(...it.days,1);
  $('#pb').innerHTML=`<dl class="meta"><dt>Tipo</dt><dd>${it.mem?"Memória":"Nota"}</dd><dt>Tema</dt><dd><i class="dot" style="background:${it.th.col}"></i>${it.th.name}</dd><dt>Leituras</dt><dd>${vezes(it.reads)}</dd><dt>Última leitura</dt><dd class="mono">${it.last}</dd><dt>${it.mem?"Origem":"Arquivo"}</dt><dd class="mono">${it.src}</dd></dl>
  <h3>Leituras por dia</h3><div class="bars" role="img" aria-label="Leituras por dia nos últimos 30 dias">${it.days.map(v=>`<b style="height:${v?Math.max(3,v/mx*36):1}px;background:${v?"var(--ac)":"var(--line)"}"></b>`).join("")}</div><div class="ax"><span>há 30 dias</span><span>hoje</span></div>
  <h3>Ligações · ${it.nb.length}</h3><ul>${it.nb.slice().sort((a,b)=>b.reads-a.reads).map(n=>`<li><button data-id="${n.id}"><i class="dot" style="background:${n.th.col}"></i><span>${n.title}</span><em>${n.mem?"Memória":"Nota"}</em></button></li>`).join("")}</ul>`;
  $('#pf').innerHTML=`<button class="pri">Abrir ${it.mem?"memória":"nota"}</button><button>${it.mem?"Arquivar":"Copiar caminho"}</button>`;
  if(focus)$('#pt').focus();dirty=true;
}
function close(){const f=panel.contains(document.activeElement);panel.hidden=true;sel=-1;if(f)cv.focus();dirty=true}
$('#pb').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)open(items[b.dataset.id])};
$('#px').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)close()});
cv.onpointermove=e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=-1,bd=1e9;
  items.forEach(it=>{if(it.vis<.5||it.ia<.5)return;const d=Math.hypot(it.x-x,it.y-y);if(d<it.r+7&&d<bd){bd=d;best=it.id}});
  if(best!==hov){hov=best;cv.style.cursor=best>=0?'pointer':'default';dirty=true}
};
cv.onpointerleave=()=>{hov=-1;dirty=true};
cv.onclick=()=>{if(hov>=0)open(items[hov])};
cv.onfocus=()=>{if(kb<0&&cv.matches(':focus-visible')){kb=items.find(show).id;dirty=true}};
cv.onblur=()=>{kb=-1;dirty=true};
cv.onkeydown=e=>{
  const v=items.filter(show),i=v.findIndex(x=>x.id===kb),d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(d){e.preventDefault();kb=v[(i+d+v.length)%v.length].id;dirty=true}
  else if((e.key==='Enter'||e.key===' ')&&kb>=0){e.preventDefault();open(items[kb],true)}
};
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,800))]).then(()=>{started=true;dirty=true;setTimeout(sim,RM?1500:3200)});
requestAnimationFrame(frame);
</script>
