[package]
name = "spike-own"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
winit = "=0.30.13"
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl"] }
cosmic-text = "0.19"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.18"
rustc-hash = "2"

[profile.dev]
debug = 0
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
debug = 0
opt-level = 3
lto = "thin"
strip = true
