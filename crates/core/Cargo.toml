[package]
name = "omnimind-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Núcleo do Omnimind: notas, memórias, diário, busca e ciclo de vida."

[lib]
name = "omnimind_core"
path = "src/lib.rs"

[dependencies]
rust-stemmers = "=1.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.24"
unicode-general-category = "=1.1.0"
