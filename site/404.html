<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Omnimind</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
@font-face { font-family: "Familjen Grotesk"; src: url("fonts/FamiljenGrotesk.ttf") format("truetype"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Sometype Mono"; src: url("fonts/SometypeMono.ttf") format("truetype"); font-weight: 400 700; font-display: swap; }
:root { color-scheme: light dark; --bg: #FFFFFF; --ink: #18181A; --sub: #55555C; --mute: #6E6E76; --line: #E7E7E4; --hover: #F0F0EE; --acc: #1F7A5C; }
@media (prefers-color-scheme: dark) { :root { --bg: #141416; --ink: #EDEDEE; --sub: #B0B0B7; --mute: #94949C; --line: #2D2D32; --hover: #232327; --acc: #4CC29A; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--bg); color: var(--ink); font: 400 17px/1.6 "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
main { width: 100%; max-width: 520px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.brand svg { width: 22px; height: 22px; }
.code { margin: 56px 0 12px; font: 500 13px/1.5 "Sometype Mono", ui-monospace, Menlo, Consolas, monospace; color: var(--mute); }
h1 { margin: 0; font-size: clamp(32px, 7vw, 44px); line-height: 1.08; font-weight: 600; letter-spacing: -.02em; }
p { margin: 16px 0 0; color: var(--sub); }
.btn { display: inline-flex; align-items: center; min-height: 46px; margin-top: 32px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; font-size: 16px; text-decoration: none; }
.btn:hover { background: var(--sub); border-color: var(--sub); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"><path d="M52 10C32 27 32 37 52 54M41 7C32 25 32 39 41 57M32 6V58M23 7C32 25 32 39 23 57M12 10C32 27 32 37 12 54"/></svg>
    Omnimind
  </div>
  <p class="code">erro 404</p>
  <h1>Esta página não existe.</h1>
  <p>O endereço pode ter mudado, ou o link veio com um erro de digitação. Nada foi perdido.</p>
  <a class="btn" id="home" href="./">Voltar ao início</a>
</main>
<script>
// No GitHub Pages de projeto, o site mora em /<repositório>/. Num caminho mais fundo, "./" não chegaria ao início.
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var onPages = /\.github\.io$/.test(location.hostname);
  document.getElementById("home").href = onPages && parts.length ? "/" + parts[0] + "/" : "/";
})();
</script>
</body>
</html>
